<!-- ============ ENTRY ============ -->
<div id="login" class="login">
  <form id="login-form" class="login-card" autocomplete="off" novalidate>
    <div class="brand">
      <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
      <div><strong id="login-product">AegisWall</strong><span id="login-tagline"></span></div>
    </div>
    <label class="field"><span id="login-user-label"></span>
      <input id="login-user" name="user" type="text" autocomplete="username" spellcheck="false" autocapitalize="none" required></label>
    <label class="field"><span id="login-pass-label"></span>
      <input id="login-pass" name="pass" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="field-error" role="alert" hidden></p>
    <button id="login-submit" class="btn btn-primary btn-wide" type="submit"></button>
    <div id="login-demo" class="login-demo"></div>
    <div id="login-license" class="login-license"></div>
  </form>
</div>

<!-- ============ APPLICATION ============ -->
<div id="app" class="app" hidden>
  <header id="header" class="header"></header>
  <nav id="rail" class="rail" aria-label="Workspaces"></nav>
  <div id="views" class="views">
    <main id="ws-wall" class="ws ws-wall" data-ws="wall"></main>
    <main id="ws-audio" class="ws ws-page" data-ws="audio" hidden></main>
    <main id="ws-system" class="ws ws-page" data-ws="system" hidden></main>
    <main id="ws-settings" class="ws ws-page" data-ws="settings" hidden></main>
  </div>
</div>

<div id="popover" class="popover" hidden></div>
<div id="dialogs"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
